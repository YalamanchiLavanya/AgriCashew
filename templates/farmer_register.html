
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Registration - AgriCashew</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>🌱 AgriCashew</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="farmer.html">Farmer</a>
            <a href="buyer.html">Buyer</a>
        </div>
    </nav>

    <section class="form-section">

        <div class="form-card">

            <h1>Farmer Registration 👨‍🌾</h1>

            <p>Create your AgriCashew account</p>

            <form id="farmerForm">

                <label>Farmer ID</label>
                <input type="text" id="farmerId"
                       placeholder="Enter Farmer ID" required>

                <label>Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name" required>

                <label>Address</label>
                <textarea id="address"
                          placeholder="Enter your address"
                          required></textarea>

                <label>Contact Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter 10-digit mobile number"
                       pattern="[0-9]{10}" required>

                <label>Farming Experience (Years)</label>
                <input type="number" id="experience"
                       placeholder="Enter experience"
                       min="0" required>

                <label>Password</label>
                <input type="password" id="password"
                       placeholder="Create password" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm password" required>

                <button type="submit" class="btn">
                    Register
                </button>

            </form>

            <p class="form-footer">
                Already have an account?
                <a href="#">Login</a>
            </p>

            <a href="farmer.html" class="back-link">
                Back to Farmer Page
            </a>

        </div>

    </section>

    <script src="../static/js/script.js"></script>

</body>
</html>
