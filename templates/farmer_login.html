
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Login - AgriCashew</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>🌱 AgriCashew</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="farmer.html">Farmer</a>
            <a href="buyer.html">Buyer</a>
        </div>
    </nav>

    <section class="form-section">

        <div class="form-card">

            <h1>Farmer Login 👨‍🌾</h1>

            <p>Welcome back to AgriCashew!</p>

            <form id="farmerLoginForm">

                <label>Farmer ID</label>
                <input
                    type="text"
                    id="loginFarmerId"
                    placeholder="Enter your Farmer ID"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="loginFarmerPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <p class="form-footer">
                Don't have an account?
                <a href="farmer_register.html">Register</a>
            </p>

            <a href="farmer.html" class="back-link">
                Back to Farmer Page
            </a>

        </div>

    </section>

    <script src="../static/js/script.js"></script>

</body>
</html>
